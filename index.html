<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Game</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-left">
          <img src="src/assets/icons/avatar.png" alt="avatar">
          <div id="name">default</div>
          <button id="edit-name-button">edit name</button>
        </div>
        <div class="header-right">
          <button id="reset-button">reset game</button>
        </div>
      </header>
      <div class="content show-content">
        <div class="scoreboard">
          <div class="coin">
            <img src="src/assets/icons/coin.png" alt="coin.png" />
            <div id="coin-amount"></div>
          </div>
          <div class="power">
            <div id="power-amount"></div>
            <img src="src/assets/icons/power.png" alt="power.png" />
          </div>
        </div>
        <div id="coin-per-sec"></div>
        <div id="click-area"><span>tap here !!</span></div>
        <div class="upgrade-income">
          <div class="above">
            <div class="heading">upgrade income</div>
            <div class="text-content">
              <span
                >upgrade your income to build your kingdom's wealth with every
                tap.</span
              >
            </div>
          </div>
          <div class="bottom">
            <div class="up-income-status">
              <span id="increment-level"></span>
              <span id="increment-amount"></span>
            </div>
            <button id="upgrade-income-button" disabled>
              <span>upgrade</span>
              <span id="increment-price"></span>
            </button>
          </div>
        </div>
        <div class="upgrade-rank">
          <div class="up-rank-top">
            <div class="heading">upgrade rank</div>
            <div class="text-content">
              coin requirements <span id="gold-requirement"></span>
            </div>
            <progress value="0" max="100" id="gold-progress"></progress>
            <div class="text-content">
              power requirements <span id="power-requirement"></span>
            </div>
            <progress value="0" max="100" id="power-progress"></progress>
          </div>
          <div class="up-rank-bottom">
            <button id="up-rank-button" disabled>upgrade</button>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="nav-upgrade">
          <nav>
            <div class="nav-upgrade-list">gold</div>
            <div class="nav-upgrade-list">power</div>
          </nav>
        </div>
        <div class="upgrade-content show-content" id="gold-up"></div>
        <div class="upgrade-content" id="power-up"></div>
      </div>
      <div class="content">coming soon</div>
      <div class="content">coming soon</div>
      <div class="content">coming soon</div>
      <footer>
        <nav>
          <div class="nav-list nav-active">
            <img src="src/assets/icons/kingdom.png" alt="" />
            kingdom
          </div>
          <div class="nav-list">
            <img src="src/assets/icons/upgrade.png" alt="" />
            upgrades
          </div>
          <div class="nav-list">
            <img src="src/assets/icons/dynasty.png" alt="" />
            dynasty
          </div>
          <div class="nav-list">
            <img src="src/assets/icons/shop.png" alt="" />
            shop
          </div>
          <div class="nav-list">
            <img src="src/assets/icons/inventory.png" alt="" />
            inventory
          </div>
        </nav>
      </footer>
    </div>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
