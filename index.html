<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Game</title>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <body>
    <div class="container">
      <header>ini header</header>
      <div class="content show-content">
        <div class="scoreboard">
          <div class="coin">
            <img src="src/assets/icons/coin.png" alt="coin.png" />
            <div id="coin-amount"></div>
          </div>
          <div class="power">
            <div id="power-amount"></div>
            <img src="src/assets/icons/power.png" alt="power.png" />
          </div>
        </div>
        <div id="coin-per-sec"></div>
        <div id="click-area"><span>tap here !!</span></div>
        <div class="upgrade-income">
          <div class="left">
            <div class="heading">upgrade income</div>
            <div class="text-content">
              <span
                >upgrade your income to build your kingdom's wealth with every
                tap.</span
              >
            </div>
          </div>
          <div class="right">
            <button id="upgrade-income-button">
              <span>upgrade</span>
              <span id="increment-price"></span>
            </button>
            <div class="up-income-status">
              <span id="increment-level"></span>
              <span id="increment-amount"></span>
            </div>
          </div>
        </div>
        <div class="upgrade-rank">
          <div class="up-rank-left">
            <div class="heading">upgrade rank</div>
            <div class="text">
              coin requirements <span id="gold-requirement"></span>
            </div>
            <progress value="0" max="100" id="gold-progress"></progress>
            <div class="text">
              power requirements <span id="power-requirement"></span>
            </div>
            <progress value="0" max="100" id="power-progress"></progress>
          </div>
          <div class="up-rank-right">
            <button id="up-rank-button">upgrade</button>
          </div>
        </div>
        <div style="height: 1200px"></div>
      </div>
      <div class="content">
        <div class="nav-upgrade">
          <nav>
            <div class="nav-upgrade-list">gold</div>
            <div class="nav-upgrade-list">power</div>
          </nav>
        </div>
        <div class="upgrade-content show-content" id="gold-up"></div>
        <div class="upgrade-content" id="power-up"></div>
      </div>
      <div class="content">coming soon</div>
      <div class="content">coming soon</div>
      <div class="content">coming soon</div>
      <footer>
        <nav>
          <div class="nav-list nav-active">kingdom</div>
          <div class="nav-list">upgrades</div>
          <div class="nav-list">dynasty</div>
          <div class="nav-list">store</div>
          <div class="nav-list">inventory</div>
        </nav>
      </footer>
    </div>
    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
